<div class="header-container">
  <p-menubar class="eye-friendly-header" [model]="items">
    <ng-template #start>
      <div class="header-left">
        <p-button class="menu-toggle logo" (click)="onToggleSidebar()" icon="pi pi-bars" />
        <h3 class="title">Scrivener Dam</h3>
      </div>
    </ng-template>

    <ng-template #item let-item let-root="root">
      <a
        class="menu-item-link"
        [href]="item.url"
        target="_blank"
        rel="noopener noreferrer"
        [title]="item.label"
        pRipple
      >
        <i class="menu-item-icon" [class]="item.icon" *ngIf="item.icon"></i>
        <span>{{ item.label }}</span>
      </a>
    </ng-template>
    <ng-template #end>
      <div
        class="header-right"
        [ngClass]="{
          'mobile-layout': isMobileView,
          'tablet-layout': isTabletView,
          'desktop-layout': isDesktopView
        }"
      >
        <!-- Current Temperature (Always visible) -->
        <span class="air-temp" *ngIf="displayCurrentTemp">
          <strong class="temp-value">{{ getTemperatureParts(displayCurrentTemp).value }}</strong>
          <span class="temp-unit">°C</span>
        </span>

        <!-- High/Low Temps (Hidden on mobile < 768px) -->
        <ng-container *ngIf="!showMinimalWeatherInfo">
          <span class="temp-display temp-high" *ngIf="displayHighestTemp">
            <img src="temperature-high-solid-full.svg" alt="high" class="weather-icon" />
            <strong class="temp-value">{{ getTemperatureParts(displayHighestTemp).value }}</strong>
            <span class="temp-unit">°C</span>
          </span>
          <span class="temp-display temp-low" *ngIf="displayLowestTemp">
            <img src="temperature-low-solid-full.svg" alt="low" class="weather-icon" />
            <strong class="temp-value">{{ getTemperatureParts(displayLowestTemp).value }}</strong>
            <span class="temp-unit">°C</span>
          </span>
        </ng-container>

        <!-- Rain Info (Hidden on mobile and tablet) -->
        <span class="rain-info" *ngIf="showFullWeatherInfo && displayRain">
          <img src="cloud-showers-heavy-solid-full.svg" alt="rain" class="weather-icon" />
          <strong>{{ displayRain }}</strong>
        </span>

        <!-- Time Display (Hidden on mobile and tablet) -->
        <span
          class="time-display"
          *ngIf="showFullWeatherInfo && displayLatestTime"
          [pTooltip]="'Latest weather update: ' + displayLatestTime"
          tooltipPosition="bottom"
        >
          <i class="pi pi-clock"></i>
        </span>

        <!-- User Info (Hidden on mobile/tablet, visible on desktop) -->
        <span
          class="user-info"
          *ngIf="isDesktopView"
          [pTooltip]="'Logged in as: ' + userName"
          tooltipPosition="bottom"
        >
          <i class="pi pi-user"></i>
        </span>

        <!-- Logout Button (Always visible) -->
        <p-button
          label=""
          variant="outlined"
          [raised]="true"
          severity="help"
          icon="pi pi-sign-out"
          tooltipPosition="bottom"
          (click)="onLogout()"
          (mousedown)="onLogout()"
        >
        </p-button>
      </div>
    </ng-template>
  </p-menubar>
</div>
